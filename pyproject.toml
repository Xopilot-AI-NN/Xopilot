[project]
name = "Xopilot"
version = "2.0.10"
description = "Xopilot by DenBroLiik"
requires-python = ">=3.10"
dependencies = [
    "flet==1.0.4",
    "screeninfo==0.8.1; platform_system != 'Android'",
    "litert-lm-api>=0.17.0; platform_system != 'Android'",
    "sounddevice==0.5.6; platform_system != 'Android'",
    "webrtcvad-wheels==2.0.14.post1; platform_system != 'Android'",
    "piper-tts==1.8.0; platform_system != 'Android'",
    "pillow==12.3.0; platform_system != 'Android'",
    "opencv-python-headless==5.0.0.93; platform_system != 'Android'",
    "pypdf==6.20.0",
    "python-docx==1.2.0",
    "reportlab>=4.4,<6",
    "openpyxl>=3.1,<4",
    "playwright>=1.55,<2; platform_system != 'Android'",
    "mss==10.2.0; platform_system != 'Android'",
    "scipy>=1.15,<2; platform_system != 'Android'",
    "cryptography==50.0.2; platform_system != 'Android'",
    "filelock==4.1.0",
    "pillow==12.3.0; platform_system == 'Android'",
    "cryptography==50.0.2; platform_system == 'Android'",
    "flet-xopilot-mobile==0.1.0; platform_system == 'Android'",
    "certifi>=2025.1.31; platform_system == 'Android'",
]
# App/requirements.txt is the desktop development install.
# Flet cross-packaging evaluates platform_system for the target platform.

[tool.flet]
org = "by.xopilot"
product = "Xopilot"
company = "Xopilot"
copyright = "Copyright (c) 2026 Xopilot"
build_number = 1
build_version = "2.0.10"

[tool.flet.app]
path = "App"
module = "App"
exclude = ["__pycache__", "*.pyc", ".flet", "build", "data", "native"]

[tool.flet.splash]
color = "#0d1117"
dark_color = "#0d1117"

# Flet 1.0.3 pins jni 1.0.0; newer jni_flutter bindings require jni 1.1.
# Match the pair used by the locally verified desktop/Android packages.
[tool.flet.flutter.pubspec.dependency_overrides]
jni = "1.0.0"
jni_flutter = "1.0.2"

[tool.flet.android]
bundle_id = "by.xopilot.app"
min_sdk_version = 26
split_per_abi = true
adaptive_icon_background = "#b3f2ff"

[tool.flet.android.dev_packages]
flet-xopilot-mobile = "extensions/flet_xopilot_mobile"

[tool.flet.android.feature]
"android.hardware.touchscreen" = false
"android.hardware.camera" = false
"android.hardware.camera.autofocus" = false
"android.hardware.microphone" = false

[tool.flet.android.gradle_properties]
"org.gradle.jvmargs" = "-Xmx2G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=128m"
"org.gradle.workers.max" = "1"
"org.gradle.parallel" = "false"
"org.gradle.daemon" = "false"
"kotlin.compiler.execution.strategy" = "in-process"
"android.builtInKotlin" = false
"android.newDsl" = false

[tool.flet.android.app]
exclude = ["__pycache__", "*.pyc", ".flet", "build", "data", "native", "advanced_xopilot*.so", "advanced_xopilot*.pyd", "assets/models/sentiment.onnx"]

[tool.flet.android.permission]
"android.permission.RECORD_AUDIO" = true
"android.permission.CAMERA" = true
