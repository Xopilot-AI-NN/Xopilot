[project]
name = "Xopilot"
version = "2.0.0"
description = "Xopilot by DenBroLiik"
requires-python = ">=3.10"
dependencies = [
	"flet==1.0.0",
	"screeninfo==0.8.1",
	"litert-lm-api>=0.17.0",
	"sounddevice==0.5.6",
	"webrtcvad-wheels==2.0.14",
	"piper-tts==1.8.0",
]
# зависимости не дублирую — см. предупреждение ниже

[tool.flet]
org = "ru.xopilot"
product = "Xopilot"
company = "Xopilot"
copyright = "Copyright (c) 2026 Xopilot"
build_number = 1
build_version = "2.0.0"

[tool.flet.app]
path = "App"
module = "App"
exclude = ["__pycache__", "*.pyc", "build"]

[tool.flet.splash]
color = "#0d1117"
dark_color = "#0d1117"
