name: Build Xopilot Rust

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*", "dev-*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: ./scripts/check.sh

  linux:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config perl libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev
      - run: cargo install dioxus-cli --version 0.7.10 --locked
      - run: ./scripts/build_linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: xopilot-linux-dioxus
          path: target/dx/xopilot/release/linux/app/
          if-no-files-found: error

  android:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Install Android toolchain
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - run: cargo install dioxus-cli --version 0.7.10 --locked
      - run: ./scripts/build_android.sh
      - uses: actions/upload-artifact@v7
        with:
          name: xopilot-android-dioxus-debug
          path: target/dx/xopilot/debug/android/**/*.apk
          if-no-files-found: error
