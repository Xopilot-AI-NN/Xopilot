[package]
name = "advanced_xopilot"
version = "1.0.0"
edition = "2024"
license = "MIT"

[lib]
name = "advanced_xopilot"
# cdylib — компилируется в нативную библиотеку (.so на Linux / .pyd на Windows),
# которую Python (Flet UI) импортирует напрямую как модуль через PyO3.
crate-type = ["cdylib"]

[dependencies]
# bundled-sqlcipher — вендорит SQLite+SQLCipher+OpenSSL прямо в крейт:
# не нужно ставить системные библиотеки на Linux/Windows, шифрование БД из коробки.
rusqlite = { version = "0.40", features = ["bundled-sqlcipher"] }
pyo3 = { version = "0.29", features = ["extension-module"] }

# хранение ключа шифрования в OS keyring (Windows Credential Manager / Linux Secret Service)
keyring = "4"
rand = "0.10"
sha2 = "0.11"
hex = "0.4"

# tract-onnx — чистый Rust ONNX-рантайм без внешней C++ библиотеки (как rusqlite bundled) —
# проще собирать/кросс-компилировать под Linux/Windows, чем ort (обёртка над ONNX Runtime).
tract-onnx = "0.21"

# candelabra — чистый Rust (candle) загрузчик/инференс GGUF-моделей (Phi/Gemma/Qwen/LLaMA и т.д.), без llama.cpp/C++.
# ГГУФ-файл кладёт сам в App/data/models/ (вручную, без автоскачивания) — только токенизатор (маленький) тянется с Hugging Face автоматически.
#
# ВАЖНО: candelabra 0.2.0 с crates.io сам пинит tokenizers = "0.19", а этот tokenizers
# не умеет парсить tokenizer.json современных моделей (напр. Phi-4-mini-instruct) — известный
# баг форматов Rust-крейта tokenizers ("data did not match any variant of untagged enum
# ModelWrapper"), проверено отдельным тестом: 0.19.1 падает, 0.21.4 — читает нормально.
# Раз crates.io-версия не даёт поднять tokenizers, используем локальную копию (vendor/candelabra)
# с tokenizers, поднятым до "0.21" — сам код candelabra не менялся, только версия зависимости.
candelabra = { path = "vendor/candelabra" }
tokenizers = "0.21"
anyhow = "1"

# чтение MachineGuid из реестра для fallback-ветки ключа на Windows
[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[profile.release]
lto = true
strip = true
opt-level = "z"  # приоритет — размер/память, не пиковая скорость