[package]
name = "xopilot"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "xopilot"

[[bin]]
name = "xopilot"
path = "main.rs"

[lib]
path = "lib.rs"

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[dependencies]
advanced_xopilot = { path = "../Services" }
dioxus = { version = "0.7.10", default-features = false, features = ["macro", "html", "signals", "hooks", "launch", "document", "asset"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "process", "io-util", "net"] }
tokio-util = "0.7"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
futures-util = "0.3"
base64 = "0.23"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
pdf-extract = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.11"
hex = "0.4"
pulldown-cmark = "0.13"
ammonia = "4"
dirs = "7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libloading = "0.9"
fs2 = "0.4"
zeroize = "1"
tempfile = "3"
libc = "0.2"
webpki-root-certs = "1"
scraper = { version = "0.29", default-features = false }
symphonia = { version = "0.5.5", features = ["all"] }
openh264 = "0.9.10"
mp4 = "0.14"
encoding_rs = "0.8"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
ndk-context = "0.1"

[dev-dependencies]
dioxus-ssr = "0.7.10"
jni = "0.22"
ndk-context = "0.1"

[[example]]
name = "interface_preview"
path = "examples/interface_preview.rs"
required-features = ["desktop"]

[[example]]
name = "interface_interaction"
path = "examples/interface_interaction.rs"
required-features = ["desktop"]

[[example]]
name = "media_smoke"
path = "examples/media_smoke.rs"
required-features = ["desktop"]
