name: Build Xopilot

on:
  workflow_dispatch:
  push:
    tags: ["v*", "dev-*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: ./scripts/check.sh
      - run: ./scripts/test.sh bridges

  build:
    if: github.event_name != 'pull_request'
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            system_name: Linux
          - os: windows-latest
            platform: windows
            system_name: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config perl libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev curl unzip zip
      - name: Configure Windows native toolchain
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure Windows Perl
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Strawberry\perl\bin\perl.exe')) { choco install strawberryperl --yes --no-progress }
          'C:\Strawberry\perl\bin' | Out-File -FilePath $env:GITHUB_PATH -Append
      - run: node scripts/install_dx.cjs
      - name: Build Rust Linux
        if: matrix.platform == 'linux'
        run: ./scripts/build_linux.sh
      - name: Build Rust Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          ./scripts/prepare_runtime.ps1
          dx build --desktop --release -p xopilot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: node scripts/package_desktop.cjs ${{ matrix.platform }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.system_name }}
          path: dist/*
          if-no-files-found: error

  android:
    if: github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install Android toolchain
        run: |
          sdkmanager "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Restore persistent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          umask 077
          mkdir -p .signing
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_PASSWORD" && test -n "$KEY_ALIAS"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > .signing/xopilot-release.jks
          printf '%s' "$STORE_PASSWORD" > .signing/store-password
          printf '%s' "$KEY_PASSWORD" > .signing/key-password
          echo "XOPILOT_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "XOPILOT_KEY_PASSWORD_FILE=$GITHUB_WORKSPACE/.signing/key-password" >> "$GITHUB_ENV"
      - run: node scripts/install_dx.cjs
      - run: ./scripts/build_android.sh
      - run: ./scripts/test.sh apk dist/android.apk
      - uses: actions/upload-artifact@v7
        with:
          name: Android
          path: dist/android.apk*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: Linux
          path: artifacts
      - uses: actions/download-artifact@v8
        with:
          name: Windows
          path: artifacts
      - uses: actions/download-artifact@v8
        with:
          name: Android
          path: artifacts
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: ${{ startsWith(github.ref_name, 'dev-') }}
          generate_release_notes: true
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/linux.zip
            artifacts/Xopilot
            artifacts/windows.zip
            artifacts/Xopilot.exe
            artifacts/android.apk
            artifacts/android.apk.sha256
